<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Process – GlobeSpark SEO & Digital Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap%22 rel="stylesheet" />
<style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-dark: #1a3a6b;
      --blue-mid: #1d6fb5;
      --blue-light: #3aa0e8;
      --charcoal: #1a1a2e;
      --off-white: #f5f8ff;
      --white: #ffffff;
      --accent: #3aa0e8;
      --text-muted: #6b7a99;
      --card-bg: #ffffff;
      --section-alt: #f0f5ff;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--charcoal);
      background: var(--white);
      overflow-x: hidden;
    }
 
    /* ── NAV (mirrored from main) ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(26,58,107,0.1);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6vw; height: 72px;
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo img { height: 48px; }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      text-decoration: none; font-size: 0.9rem; font-weight: 500;
      color: var(--charcoal); transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--blue-mid); }
    .nav-cta {
      background: var(--blue-mid); color: white;
      border: none; padding: 10px 22px; border-radius: 6px;
      font-size: 0.875rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: background 0.2s;
    }
    .nav-cta:hover { background: var(--blue-dark); }
 
    .nav-toggle {
      display: none;
      width: 40px; height: 40px;
      background: transparent; border: none; cursor: pointer;
      align-items: center; justify-content: center;
      position: relative; z-index: 1100;
    }
    .nav-toggle span {
      display: block; position: absolute;
      width: 22px; height: 2px; border-radius: 2px;
      background: var(--blue-dark);
      transition: 0.3s;
    }
    .nav-toggle span:nth-child(1) { top: 14px; }
    .nav-toggle span:nth-child(2) { top: 20px; }
    .nav-toggle span:nth-child(3) { top: 26px; }
    .nav-toggle.active span:nth-child(1) { top: 20px; transform: rotate(45deg); }
    .nav-toggle.active span:nth-child(2) { opacity: 0; }
    .nav-toggle.active span:nth-child(3) { top: 20px; transform: rotate(-45deg); }
 
    .mobile-menu {
      display: none;
      position: fixed; top: 72px; left: 0; right: 0;
      background: white;
      box-shadow: 0 16px 32px rgba(26,58,107,0.1);
      padding: 12px 6vw 24px;
      flex-direction: column;
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease;
      z-index: 999;
    }
    .mobile-menu.open { max-height: 420px; }
    .mobile-menu a {
      text-decoration: none; color: var(--charcoal);
      font-size: 1rem; padding: 14px 4px;
      border-bottom: 1px solid rgba(26,58,107,0.07);
    }
 
    /* ── HERO (inner page) ── */
    .page-hero {
      min-height: 40vh;
      background: linear-gradient(135deg, var(--blue-dark) 0%, #0f2a54 40%, #0a1f3d 100%);
      display: flex; align-items: center;
      padding: 120px 6vw 60px;
      position: relative; overflow: hidden;
    }
    .page-hero::before {
      content: '';
      position: absolute; top: -40%; right: -10%;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(58,160,232,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .page-hero-content {
      max-width: 800px; position: relative; z-index: 2;
    }
    .page-hero-content .section-eyebrow {
      color: var(--blue-light);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; margin-bottom: 12px;
    }
    .page-hero-content h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.2rem, 4.5vw, 3.4rem);
      font-weight: 900; color: white; line-height: 1.1;
      margin-bottom: 16px;
    }
    .page-hero-content h1 span { color: var(--blue-light); }
    .page-hero-content p {
      font-size: 1.05rem; color: rgba(255,255,255,0.7);
      line-height: 1.7; max-width: 540px;
    }
 
    /* ── PROCESS DETAIL ── */
    .process-detail { padding: 90px 6vw; background: var(--white); }
    .process-detail .section-inner { max-width: 1200px; margin: 0 auto; }
 
    .step-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px 60px;
      margin-top: 40px;
      padding: 40px 0;
      border-bottom: 1px solid rgba(26,58,107,0.08);
    }
    .step-block:last-child { border-bottom: none; }
    .step-block.reverse { direction: rtl; }
    .step-block.reverse > * { direction: ltr; }
 
    .step-visual {
      background: var(--section-alt);
      border-radius: 20px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 220px;
      border: 1px solid rgba(26,58,107,0.06);
    }
    .step-visual .step-number-big {
      font-family: 'Montserrat', sans-serif;
      font-size: 3.8rem;
      font-weight: 900;
      color: var(--blue-light);
      opacity: 0.15;
      position: absolute;
      bottom: 8px;
      right: 20px;
      line-height: 1;
    }
    .step-visual h3 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .step-visual p {
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 90%;
    }
    .step-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 24px;
      margin-top: 18px;
    }
    .step-meta span {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      background: white;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      border: 1px solid rgba(26,58,107,0.08);
      color: var(--blue-dark);
      font-weight: 500;
    }
    .step-meta span i { font-style: normal; font-size: 1.1rem; }
 
    .step-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .step-content h4 {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 10px;
    }
    .step-content ul {
      list-style: none;
      margin-top: 8px;
    }
    .step-content ul li {
      padding: 8px 0 8px 28px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%233aa0e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>') left center no-repeat;
      background-size: 18px;
      color: var(--charcoal);
      font-weight: 400;
      line-height: 1.5;
    }
 
    /* ── CTA BANNER (process specific) ── */
    .cta-banner {
      background: linear-gradient(135deg, var(--blue-dark), #0a1f3d);
      text-align: center;
      padding: 80px 6vw;
    }
    .cta-banner .section-eyebrow { color: var(--blue-light); }
    .cta-banner h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      font-weight: 800;
      color: white;
      margin: 12px auto 16px;
      max-width: 640px;
    }
    .cta-banner p {
      color: rgba(255,255,255,0.65);
      max-width: 520px;
      margin: 0 auto 32px;
      font-size: 1rem;
      line-height: 1.6;
    }
    .cta-banner .btn-primary {
      background: var(--blue-light); color: white;
      padding: 14px 38px; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600; text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
    .cta-banner .btn-primary:hover { background: #2589d1; transform: translateY(-2px); }
 
    /* ── FOOTER (mirrored) ── */
    footer {
      background: var(--charcoal);
      padding: 48px 6vw 28px;
      color: rgba(255,255,255,0.5);
    }
    .footer-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 20px;
    }
    .footer-logo { display: flex; align-items: center; gap: 10px; }
    .footer-logo img { height: 36px; filter: brightness(2); }
    .footer-brand {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem; font-weight: 800; color: white;
    }
    .footer-links { display: flex; gap: 24px; }
    .footer-links a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
    .footer-links a:hover { color: var(--blue-light); }
    .footer-copy { font-size: 0.8rem; margin-top: 24px; text-align: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px; }
 
    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .step-block { grid-template-columns: 1fr; gap: 20px; direction: ltr !important; }
      .step-block.reverse { direction: ltr !important; }
      .step-block.reverse > * { direction: ltr !important; }
      .step-visual { min-height: auto; }
      .step-visual p { max-width: 100%; }
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .mobile-menu { display: flex; }
      .footer-inner { flex-direction: column; text-align: center; }
      .page-hero { min-height: 30vh; padding: 100px 6vw 40px; }
    }
</style>
</head>
