<title>GlobeSpark – SEO & Digital Marketing Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue-dark: #1a3a6b;
    --blue-mid: #1d6fb5;
    --blue-light: #3aa0e8;
    --charcoal: #1a1a2e;
    --off-white: #f5f8ff;
    --white: #ffffff;
    --accent: #3aa0e8;
    --text-muted: #6b7a99;
    --card-bg: #ffffff;
    --section-alt: #f0f5ff;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--charcoal);
    background: var(--white);
    overflow-x: hidden;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(26,58,107,0.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6vw; height: 72px;
  }

  .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .nav-logo img { height: 48px; }

  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a {
    text-decoration: none; font-size: 0.9rem; font-weight: 500;
    color: var(--charcoal); transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--blue-mid); }

  .nav-cta {
    background: var(--blue-mid); color: white;
    border: none; padding: 10px 22px; border-radius: 6px;
    font-size: 0.875rem; font-weight: 600; cursor: pointer;
    text-decoration: none; transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--blue-dark); }
  
  /* ── MOBILE NAV TOGGLE ── */
  .nav-toggle {
    display: none;
    width: 40px; height: 40px;
    background: transparent; border: none; cursor: pointer;
    align-items: center; justify-content: center;
    position: relative; z-index: 1100;
    flex-direction: column;
    gap: 5px;
  }
  .nav-toggle span {
    display: block;
    width: 25px; height: 3px;
    border-radius: 3px;
    background: var(--blue-dark);
    transition: 0.3s ease;
  }
  .nav-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
  .nav-toggle.active span:nth-child(2) { opacity: 0; }
  .nav-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

  /* ── MOBILE MENU ── */
  .mobile-menu {
    display: none;
    position: fixed; top: 72px; left: 0; right: 0;
    background: white;
    box-shadow: 0 16px 32px rgba(26,58,107,0.15);
    padding: 12px 6vw 24px;
    flex-direction: column;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, opacity 0.3s ease;
    opacity: 0;
    z-index: 999;
  }
  .mobile-menu.open {
    display: flex;
    max-height: 500px;
    opacity: 1;
  }
  .mobile-menu a {
    text-decoration: none; color: var(--charcoal);
    font-size: 1rem; font-weight: 500;
    padding: 14px 4px;
    border-bottom: 1px solid rgba(26,58,107,0.07);
    transition: color 0.2s;
  }
  .mobile-menu a:hover { color: var(--blue-mid); }
  .mobile-menu a:last-child { border-bottom: none; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--blue-dark) 0%, #0f2a54 40%, #0a1f3d 100%);
    display: flex; align-items: center;
    padding: 100px 6vw 60px;
    position: relative; overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute; top: -50%; right: -10%;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(58,160,232,0.18) 0%, transparent 70%);
    border-radius: 50%;
  }

  .hero-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
    align-items: center; max-width: 1200px; margin: 0 auto; width: 100%;
    position: relative; z-index: 1;
  }

  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(58,160,232,0.15);
    border: 1px solid rgba(58,160,232,0.3);
    color: var(--blue-light);
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 16px; border-radius: 100px; margin-bottom: 24px;
  }

  .hero h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(2.4rem, 5vw, 3.8rem);
    font-weight: 900; color: white; line-height: 1.1;
    margin-bottom: 20px;
  }

  .hero h1 span { color: var(--blue-light); }

  .hero-sub {
    font-size: 1.05rem; color: rgba(255,255,255,0.7);
    line-height: 1.7; margin-bottom: 36px; max-width: 480px;
  }

  .hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }

  .btn-primary {
    background: var(--blue-light); color: white;
    padding: 14px 32px; border-radius: 8px;
    font-size: 0.95rem; font-weight: 600; text-decoration: none;
    transition: all 0.2s; display: inline-block;
  }
  .btn-primary:hover { background: #2589d1; transform: translateY(-2px); }

  .btn-outline {
    border: 2px solid rgba(255,255,255,0.3); color: white;
    padding: 14px 32px; border-radius: 8px;
    font-size: 0.95rem; font-weight: 600; text-decoration: none;
    transition: all 0.2s; display: inline-block;
  }
  .btn-outline:hover { border-color: white; background: rgba(255,255,255,0.08); }

  .hero-stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
  }

  .stat-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px; padding: 24px 20px; text-align: center;
  }

  .stat-num {
    font-family: 'Montserrat', sans-serif;
    font-size: 2.2rem; font-weight: 900;
    color: var(--blue-light); line-height: 1;
  }

  .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 6px; }

  /* ── SECTIONS ── */
  section { padding: 90px 6vw; }

  .section-inner { max-width: 1200px; margin: 0 auto; }

  .section-eyebrow {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--blue-mid);
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 800; color: var(--blue-dark); line-height: 1.2;
    margin-bottom: 16px;
  }

  .section-sub {
    font-size: 1rem; color: var(--text-muted); line-height: 1.7;
    max-width: 540px;
  }

  /* ── SERVICES ── */
  #services { background: var(--section-alt); }

  .services-header { margin-bottom: 56px; }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .service-card {
    background: white; border-radius: 16px;
    padding: 32px 28px;
    border: 1px solid rgba(26,58,107,0.08);
    transition: transform 0.25s, box-shadow 0.25s;
    position: relative; overflow: hidden;
  }

  .service-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue-mid), var(--blue-light));
    opacity: 0; transition: opacity 0.25s;
  }

  .service-card:hover { transform: translateY(-6px); box-shadow: 0 20px 48px rgba(26,58,107,0.12); }
  .service-card:hover::before { opacity: 1; }

  .service-icon {
    width: 52px; height: 52px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; margin-bottom: 20px;
  }

  .service-card h3 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.1rem; font-weight: 700; color: var(--blue-dark);
    margin-bottom: 10px;
  }

  .service-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

  /* ── WHY US ── */
  #why { background: white; }

  .why-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
    align-items: center;
  }

  .why-list { list-style: none; margin-top: 32px; }

  .why-item {
    display: flex; gap: 16px; align-items: flex-start;
    padding: 18px 0; border-bottom: 1px solid rgba(26,58,107,0.07);
  }

  .why-icon {
    width: 40px; height: 40px; min-width: 40px;
    background: var(--section-alt); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
  }

  .why-item h4 {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem; font-weight: 700; color: var(--blue-dark); margin-bottom: 4px;
  }

  .why-item p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }

  .why-visual {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    border-radius: 20px; padding: 48px; color: white;
    position: relative; overflow: hidden;
  }

  .why-visual::before {
    content: '';
    position: absolute; bottom: -30%; right: -15%;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
    border-radius: 50%;
  }

  .why-visual h3 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.6rem; font-weight: 800; margin-bottom: 16px;
  }

  .why-visual p { font-size: 0.95rem; opacity: 0.8; line-height: 1.7; margin-bottom: 28px; }

  .metric-row { display: flex; gap: 24px; flex-wrap: wrap; }

  .metric {
    background: rgba(255,255,255,0.1); border-radius: 10px; padding: 16px 20px;
  }

  .metric-val {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.8rem; font-weight: 900; color: var(--blue-light);
  }

  .metric-desc { font-size: 0.78rem; opacity: 0.7; margin-top: 2px; }

  /* ── TEAM ── */
  #team { background: var(--section-alt); }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 28px; margin-top: 48px;
  }

  .team-card {
    background: white; border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(26,58,107,0.08);
    transition: transform 0.25s, box-shadow 0.25s;
  }

  .team-card:hover { transform: translateY(-6px); box-shadow: 0 24px 56px rgba(26,58,107,0.13); }

  .team-banner {
    height: 120px;
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-mid));
    position: relative;
  }

  .team-avatar {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 4px solid white;
    background: linear-gradient(135deg, var(--blue-light), var(--blue-dark));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 1.6rem; font-weight: 900; color: white;
    position: absolute; bottom: -40px; left: 28px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }

  .team-body { padding: 52px 28px 28px; }

  .team-name {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.1rem; font-weight: 800; color: var(--blue-dark);
    margin-bottom: 4px;
  }

  .team-role {
    display: inline-block;
    background: rgba(29,111,181,0.1);
    color: var(--blue-mid);
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em;
    padding: 4px 12px; border-radius: 100px; margin-bottom: 14px;
  }

  .team-sub { font-size: 0.85rem; color: var(--text-muted); line-height: 1.55; }

  .team-socials { display: flex; gap: 10px; margin-top: 18px; }

  .social-btn {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--section-alt);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem; text-decoration: none; transition: background 0.2s;
  }

  .social-btn:hover { background: var(--blue-mid); }

  /* ── PROCESS ── */
  #process { background: white; }

  .process-steps {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 0; margin-top: 48px; position: relative;
  }

  .process-step { text-align: center; padding: 32px 20px; position: relative; }

  .process-step:not(:last-child)::after {
    content: '→';
    position: absolute; right: -10px; top: 44px;
    font-size: 1.4rem; color: var(--blue-light);
  }

  .step-num {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, var(--blue-mid), var(--blue-light));
    color: white; font-family: 'Montserrat', sans-serif;
    font-size: 1.2rem; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }

  .process-step h4 {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem; font-weight: 700; color: var(--blue-dark); margin-bottom: 8px;
  }

  .process-step p { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; }

  /* ── CTA ── */
  #contact {
    background: linear-gradient(135deg, var(--blue-dark), #0a1f3d);
    text-align: center; padding: 100px 6vw;
  }

  #contact .section-eyebrow { color: var(--blue-light); }
  #contact .section-title { color: white; max-width: 620px; margin: 0 auto 16px; }
  #contact .section-sub { color: rgba(255,255,255,0.65); margin: 0 auto 40px; }

  .contact-form {
    max-width: 560px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 16px;
  }

  .form-row { display: flex; gap: 16px; }

  .form-input, .form-textarea {
    width: 100%; padding: 14px 18px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px; color: white; font-size: 0.9rem;
    font-family: 'Inter', sans-serif; outline: none;
    transition: border-color 0.2s;
  }

  .form-input::placeholder, .form-textarea::placeholder { color: rgba(255,255,255,0.4); }
  .form-input:focus, .form-textarea:focus { border-color: var(--blue-light); }

  .form-textarea { resize: vertical; min-height: 120px; }

  .form-submit {
    background: var(--blue-light); color: white;
    border: none; padding: 15px; border-radius: 8px;
    font-size: 0.95rem; font-weight: 700; cursor: pointer;
    font-family: 'Montserrat', sans-serif; letter-spacing: 0.05em;
    transition: background 0.2s;
  }

  .form-submit:hover { background: #2589d1; }

  /* ── FOOTER ── */
  footer {
    background: var(--charcoal);
    padding: 48px 6vw 28px;
    color: rgba(255,255,255,0.5);
  }

  .footer-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 20px;
  }

  .footer-logo { display: flex; align-items: center; gap: 10px; }
  .footer-logo img { height: 36px; filter: brightness(2); }
  .footer-brand {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.1rem; font-weight: 800; color: white;
  }

  .footer-links { display: flex; gap: 24px; }
  .footer-links a { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
  .footer-links a:hover { color: var(--blue-light); }

  .footer-copy { font-size: 0.8rem; margin-top: 24px; text-align: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 24px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .hero-grid, .why-grid { grid-template-columns: 1fr; }
    .hero-stats { grid-template-columns: 1fr 1fr 1fr; }
    .form-row { flex-direction: column; }
    .process-step:not(:last-child)::after { display: none; }
    .nav-links { display: none; }
    .nav-toggle { display: flex; }
    .footer-inner { flex-direction: column; text-align: center; }
  }
</style>
</head>
